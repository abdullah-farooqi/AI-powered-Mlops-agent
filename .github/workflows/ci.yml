name: MLOps Agent CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: 'pip'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Lint with Flake8
      run: |
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=120 --statistics

    - name: Run Automated Pytest Suite with Coverage
      run: |
        pytest --cov=agent --cov=api --cov-report=term --cov-report=xml tests/

    - name: Validate Kubernetes Manifests
      run: |
        python -c "
        import yaml
        for f in ['kubernetes/configmap.yaml', 'kubernetes/deployment.yaml', 'kubernetes/service.yaml']:
            with open(f) as stream:
                yaml.safe_load(stream)
            print(f'Validated manifest: {f}')
        "
