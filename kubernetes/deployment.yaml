apiVersion: apps/v1
kind: Deployment
metadata:
  name: mlops-prediction-deployment
  namespace: mlops-app
  labels:
    app: mlops-prediction-api
    version: "1.0.0"
spec:
  replicas: 2
  selector:
    matchLabels:
      app: mlops-prediction-api
  template:
    metadata:
      labels:
        app: mlops-prediction-api
        version: "1.0.0"
    spec:
      containers:
      - name: inference-service
        image: mlops-prediction-api:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8000
          name: http
        envFrom:
        - configMapRef:
            name: mlops-prediction-config
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "500m"
            memory: "256Mi"
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 2
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /ready
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 2
          failureThreshold: 2
